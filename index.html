<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>노무 사전점검 상담 | 노무법인 하이랩 김포지사</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .phone-wrap {
      width: 100%;
      max-width: 420px;
      background: #f0f2f5;
      border-radius: 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
      min-height: 700px;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      background: #1a2e4a;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: white;
    }
    .header-back {
      font-size: 20px;
      cursor: pointer;
      opacity: 0.8;
    }
    .header-avatar {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .header-info { flex: 1; }
    .header-name { font-size: 15px; font-weight: 600; }
    .header-sub { font-size: 11px; opacity: 0.7; margin-top: 1px; }
    .header-icons { display: flex; gap: 16px; font-size: 18px; opacity: 0.8; }

    /* 채팅 영역 */
    .chat-body {
      flex: 1;
      background: #f0f2f5;
      padding: 16px 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 500px;
    }

    /* 날짜 구분선 */
    .date-divider {
      text-align: center;
      font-size: 11px;
      color: #666;
      margin: 4px 0;
    }
    .date-divider span {
      background: rgba(0,0,0,0.12);
      padding: 3px 12px;
      border-radius: 20px;
    }

    /* 봇 메시지 (왼쪽) */
    .msg-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .msg-row.user { flex-direction: row-reverse; }

    .bot-avatar {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: #1a2e4a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .msg-content { max-width: 70%; }
    .msg-name { font-size: 11px; color: #555; margin-bottom: 3px; font-weight: 600; }

    .bubble {
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.55;
      word-break: keep-all;
    }
    .bubble.bot {
      background: white;
      border-top-left-radius: 4px;
      color: #222;
    }
    .bubble.user {
      background: #1a2e4a;
      border-top-right-radius: 4px;
      color: white;
      text-align: right;
    }

    .msg-time {
      font-size: 10px;
      color: #888;
      margin-top: 4px;
      align-self: flex-end;
    }
    .msg-row.user .msg-time { text-align: right; }

    /* 선택지 버튼 */
    .options-wrap {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-top: 4px;
    }
    .opt-btn {
      background: white;
      border: 1.5px solid #ddd;
      border-radius: 20px;
      padding: 9px 18px;
      font-size: 13px;
      color: #3a3a3a;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
      font-family: inherit;
    }
    .opt-btn:hover { background: #eef1f6; border-color: #1a2e4a; }
    .opt-btn.selected { background: #1a2e4a; border-color: #1a2e4a; color: white; font-weight: 600; }
    .opt-btn:disabled { opacity: 0.5; cursor: default; }

    /* 진행 바 */
    .progress-bar {
      background: rgba(0,0,0,0.1);
      height: 4px;
      margin: 0 12px;
    }
    .progress-fill {
      height: 100%;
      background: #4a7fc1;
      transition: width 0.4s ease;
      border-radius: 2px;
    }

    /* 결과 카드 */
    .result-card {
      background: white;
      border-radius: 16px;
      padding: 18px;
      font-size: 13px;
      line-height: 1.6;
      border-top-left-radius: 4px;
    }
    .result-card .badge {
      display: inline-block;
      background: #e8edf4;
      color: #1a2e4a;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    .result-card h3 {
      font-size: 15px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 8px;
    }
    .result-card .point-list {
      list-style: none;
      margin: 8px 0;
    }
    .result-card .point-list li {
      padding: 5px 0;
      display: flex;
      gap: 6px;
      font-size: 13px;
    }
    .result-card .point-list li::before {
      content: "•";
      color: #e6b800;
      font-weight: 700;
    }
    .urgency-bar {
      margin: 12px 0;
    }
    .urgency-label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #888;
      margin-bottom: 4px;
    }
    .urgency-track {
      background: #eee;
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
    }
    .urgency-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 1s ease;
    }
    .urgency-fill.high { background: #e74c3c; }
    .urgency-fill.mid  { background: #f39c12; }
    .urgency-fill.low  { background: #27ae60; }

    /* CTA 버튼 */
    .cta-wrap {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 6px;
    }
    .cta-btn {
      display: block;
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      border: none;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }
    .cta-btn.primary {
      background: #1a2e4a;
      color: white;
    }
    .cta-btn.primary:hover { background: #243d5e; }
    .cta-btn.secondary {
      background: #2c3e50;
      color: white;
    }
    .cta-btn.secondary:hover { background: #1a2e4a; }
    .cta-btn.outline {
      background: white;
      color: #555;
      border: 1.5px solid #ddd;
    }
    .cta-btn.outline:hover { background: #f9f9f9; }

    /* 텍스트 입력 영역 */
    .text-input-wrap {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .text-input-wrap textarea {
      flex: 1;
      padding: 10px 12px;
      border-radius: 20px;
      border: 1.5px solid #ddd;
      font-size: 13px;
      font-family: inherit;
      resize: none;
      height: 60px;
      background: white;
    }
    .text-input-wrap textarea:focus { outline: none; border-color: #1a2e4a; }
    .send-btn {
      width: 48px;
      height: 60px;
      background: #1a2e4a;
      border: none;
      border-radius: 20px;
      font-size: 18px;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* 타이핑 인디케이터 */
    .typing {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .typing-bubble {
      background: white;
      border-radius: 16px;
      border-top-left-radius: 4px;
      padding: 12px 16px;
      display: flex;
      gap: 5px;
      align-items: center;
    }
    .typing-dot {
      width: 7px;
      height: 7px;
      background: #aaa;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    /* 하단 입력창 */
    .chat-footer {
      background: #f0f0f0;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-top: 1px solid #ddd;
    }
    .footer-icons { display: flex; gap: 14px; font-size: 20px; color: #888; }
    .footer-input {
      flex: 1;
      background: white;
      border-radius: 20px;
      padding: 9px 14px;
      font-size: 14px;
      border: 1px solid #ddd;
      color: #aaa;
    }
    .footer-send { font-size: 22px; color: #aaa; }
  </style>
</head>
<body>

<div class="phone-wrap">

  <!-- 헤더 -->
  <div class="chat-header">
    <span class="header-back" onclick="goBack()" style="cursor:pointer">‹</span>
    <div class="header-avatar">⚖️</div>
    <div class="header-info">
      <div class="header-name">노무 사전점검 상담</div>
      <div class="header-sub">노무법인 하이랩 김포지사</div>
    </div>
    <div class="header-icons">
      <span>🔍</span>
      <span>☰</span>
    </div>
  </div>

  <!-- 진행바 -->
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
  </div>

  <!-- 채팅 -->
  <div class="chat-body" id="chatBody">
    <div class="date-divider"><span>오늘</span></div>
  </div>

  <!-- 하단 (비활성) -->
  <div class="chat-footer">
    <div class="footer-icons">
      <span>+</span>
    </div>
    <div class="footer-input">버튼을 선택하여 답변해주세요</div>
    <span class="footer-send">➤</span>
  </div>

</div>

<script>
  const chatBody = document.getElementById('chatBody');
  const progressFill = document.getElementById('progressFill');

  const BOOKING_URL = 'https://map.naver.com/p/entry/place/1207991612?placePath=/ticket?entry=plt&from=map&fromPanelNum=1&additionalHeight=76&timestamp=202603240522&locale=ko&svcName=map_pcv5&searchType=place&lng=126.6240220&lat=37.6438700&c=15.00,0,0,0,dh';
  const PHONE = '031-8049-3463';

  function nowTime() {
    const d = new Date();
    const h = d.getHours();
    const m = String(d.getMinutes()).padStart(2,'0');
    const ampm = h < 12 ? '오전' : '오후';
    return `${ampm} ${h > 12 ? h-12 : h}:${m}`;
  }

  const answers = {};
  const stepHistory = [];

  function recordStep(func, answerKeys = []) {
    const marker = document.createElement('div');
    marker.className = 'step-marker';
    marker.style.display = 'none';
    chatBody.appendChild(marker);
    stepHistory.push({ marker, func, answerKeys });
  }

  function goBack() {
    if (stepHistory.length <= 1) {
      const overlay = document.createElement('div');
      overlay.style.cssText = `position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:9999;`;
      overlay.innerHTML = `
        <div style="background:white;border-radius:16px;padding:24px 20px;max-width:300px;width:90%;text-align:center;font-family:inherit">
          <div style="font-size:16px;font-weight:700;color:#222;margin-bottom:8px">처음부터 다시 시작할까요?</div>
          <div style="font-size:13px;color:#888;margin-bottom:20px;line-height:1.6">지금까지 입력한 내용이 모두 초기화됩니다.</div>
          <div style="display:flex;gap:8px">
            <button onclick="this.closest('div[style*=fixed]').remove()" style="flex:1;padding:12px;background:white;border:1.5px solid #ddd;border-radius:10px;font-size:14px;color:#555;cursor:pointer;font-family:inherit">취소</button>
            <button onclick="location.reload()" style="flex:1;padding:12px;background:#1a2e4a;color:white;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit">처음으로</button>
          </div>
        </div>`;
      document.body.appendChild(overlay);
      overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
      return;
    }

    // 1. 현재 스텝 pop → 해당 answerKeys 삭제
    const current = stepHistory.pop();
    current.answerKeys.forEach(k => delete answers[k]);

    // 2. 이전 스텝이 새로운 top
    const prev = stepHistory[stepHistory.length - 1];

    // 3. prev.marker 이후 DOM 전부 제거 (이전 질문 내용 + 현재 질문 내용 모두)
    while (prev.marker.nextSibling) {
      chatBody.removeChild(prev.marker.nextSibling);
    }

    // 4. 이전 스텝의 answerKeys도 삭제 (재질문할 예정)
    prev.answerKeys.forEach(k => delete answers[k]);

    // 5. 이전 스텝 pop (재호출 시 recordStep이 다시 push하므로)
    stepHistory.pop();

    // 6. 이전 스텝 함수 재호출
    prev.func();
  }

  const totalSteps = 10;

  function updateProgress(step) {
    progressFill.style.width = `${(step / totalSteps) * 100}%`;
  }

  function scrollDown() {
    setTimeout(() => chatBody.scrollTop = chatBody.scrollHeight, 100);
  }

  function addTyping() {
    const row = document.createElement('div');
    row.className = 'typing';
    row.innerHTML = `
      <div class="bot-avatar">⚖️</div>
      <div class="typing-bubble">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>`;
    chatBody.appendChild(row);
    scrollDown();
    return row;
  }

  function addBotMessage(html, withAvatar = true, delay = 0) {
    return new Promise(resolve => {
      setTimeout(() => {
        const typing = addTyping();
        setTimeout(() => {
          typing.remove();
          const row = document.createElement('div');
          row.className = 'msg-row';
          row.innerHTML = `
            ${withAvatar ? `<div class="bot-avatar">⚖️</div>` : `<div style="width:36px;flex-shrink:0"></div>`}
            <div class="msg-content">
              ${withAvatar ? `<div class="msg-name">노무법인 하이랩</div>` : ''}
              <div class="bubble bot">${html}</div>
            </div>
            <div class="msg-time">${nowTime()}</div>`;
          chatBody.appendChild(row);
          scrollDown();
          resolve(row);
        }, 900);
      }, delay);
    });
  }

  function addUserMessage(text) {
    const row = document.createElement('div');
    row.className = 'msg-row user';
    row.innerHTML = `
      <div class="msg-content">
        <div class="bubble user">${text}</div>
      </div>
      <div class="msg-time">${nowTime()}</div>`;
    chatBody.appendChild(row);
    scrollDown();
  }

  function addOptions(options, onSelect) {
    const wrap = document.createElement('div');
    wrap.className = 'options-wrap';
    wrap.style.paddingLeft = '44px';
    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.textContent = opt.label;
      btn.onclick = () => {
        wrap.querySelectorAll('button').forEach(b => { b.disabled = true; b.classList.remove('selected'); });
        btn.classList.add('selected');
        addUserMessage(opt.label);
        setTimeout(() => wrap.remove(), 300);
        onSelect(opt);
      };
      wrap.appendChild(btn);
    });

    // 뒤로가기 버튼
    const backBtn = document.createElement('button');
    backBtn.textContent = '← 이전 질문으로';
    backBtn.style.cssText = `
      background:transparent; border:none; color:#aaa;
      font-size:12px; padding:6px 4px; cursor:pointer;
      font-family:inherit; text-align:left; margin-top:2px;
    `;
    backBtn.onmouseover = () => backBtn.style.color = '#666';
    backBtn.onmouseout  = () => backBtn.style.color = '#aaa';
    backBtn.onclick = () => { wrap.remove(); goBack(); };
    wrap.appendChild(backBtn);

    chatBody.appendChild(wrap);
    scrollDown();
    return wrap;
  }

  function addTextInput(placeholder, onSubmit) {
    const wrap = document.createElement('div');
    wrap.className = 'text-input-wrap';
    wrap.style.paddingLeft = '44px';
    const uid = 'ft_' + Date.now();
    wrap.innerHTML = `
      <textarea placeholder="${placeholder}" id="${uid}"></textarea>
      <button class="send-btn" id="sb_${uid}">➤</button>`;
    chatBody.appendChild(wrap);
    scrollDown();
    const ta = wrap.querySelector(`#${uid}`);
    const btn = wrap.querySelector(`#sb_${uid}`);
    const submit = () => {
      const val = ta.value.trim();
      if (!val) return;
      ta.disabled = true; btn.disabled = true;
      addUserMessage(val.replace(/\n/g, '<br>'));
      setTimeout(() => wrap.remove(), 200);
      onSubmit(val);
    };
    btn.onclick = submit;
    ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); } });
    return wrap;
  }

  // ==================== 공통 Q1~Q3 ====================

  async function step0_intro() {
    await addBotMessage(`안녕하세요.<br>노무법인 하이랩 김포지사입니다.<br><br>몇 가지 질문을 통해 <strong>유료 상담이 필요한 사안인지 사전에 판단</strong>해 드립니다. 노무사님이 내용을 검토한 후 직접 연락드립니다.<br><br>⏱ 소요시간: 약 3~5분<br>🔒 마지막 단계에서 개인정보 수집 동의 후 연락처를 입력합니다.`);
    setTimeout(() => {
      const wrap = document.createElement('div');
      wrap.style.paddingLeft = '44px';
      wrap.innerHTML = `<button class="cta-btn primary" id="startBtn" style="max-width:280px">✅ 사전점검 상담 시작하기</button>`;
      chatBody.appendChild(wrap);
      scrollDown();
      wrap.querySelector('#startBtn').onclick = () => {
        wrap.remove();
        addUserMessage('사전점검 상담 시작하기');
        step1();
      };
    }, 200);
  }

  async function step1() {
    updateProgress(1);
    recordStep(step1, ['side']);
    await addBotMessage(`<strong>Q1. 어떤 입장으로 문의하시나요?</strong>`);
    addOptions([
      { label: '👤 근로자 (직원)', value: '근로자' },
      { label: '🏢 사용자 (사업주 / 인사담당자)', value: '사용자' },
    ], opt => { answers.side = opt.value; step2(); });
  }

  async function step2() {
    updateProgress(2);
    recordStep(step2, ['caseType', 'bizIssue', 'bizLabel']);
    if (answers.side === '근로자') {
      await addBotMessage(`<strong>Q2. 어떤 문제로 도움이 필요하신가요?</strong>`);
      addOptions([
        { label: '🚫 부당해고 / 권고사직', value: '부당해고' },
        { label: '💰 임금체불 / 퇴직금', value: '임금체불' },
        { label: '😰 직장 내 괴롭힘 / 성희롱', value: '직장내괴롭힘' },
        { label: '📄 근로계약 / 취업규칙 위반', value: '근로계약' },
        { label: '기타 노동 문제', value: '기타' },
      ], opt => { answers.caseType = opt.value; step3(); });
    } else {
      await addBotMessage(`<strong>Q2. 어떤 이슈로 문의하시나요?</strong>`);
      addOptions([
        { label: '⚖️ 직원 해고·징계 처리',       value: '기업자문', bizIssue: '해고처리' },
        { label: '💴 임금체불 진정·분쟁 대응',     value: '기업자문', bizIssue: '분쟁예방' },
        { label: '😰 직장 내 괴롭힘 신고 대응',    value: '직장내괴롭힘', bizIssue: '괴롭힘대응' },
        { label: '📝 근로계약서·취업규칙 정비',    value: '기업자문', bizIssue: '계약서' },
        { label: '🔍 전반적인 인사노무 점검',       value: '기업자문', bizIssue: '전반점검' },
      ], opt => {
        answers.caseType = opt.value;
        answers.bizIssue = opt.bizIssue;
        answers.bizLabel = opt.label;
        step3();
      });
    }
  }

  async function step3() {
    updateProgress(3);
    recordStep(step3, ['companySize']);
    await addBotMessage(`<strong>Q3. 회사 상시 직원 수는 몇 명인가요?</strong><br><small style="color:#888">직원 수에 따라 적용되는 법 조항이 달라집니다</small>`);
    addOptions([
      { label: '4인 이하 (5인 미만)', value: '5인미만' },

              <button class="time-btn" data-val="오전(9~12시)" onclick="selectTime(this,'${formId}_time')"
                style="padding:7px 14px;border:1.5px solid #ddd;border-radius:20px;background:white;font-size:13px;cursor:pointer;font-family:inherit">오전 (9~12시)</button>
              <button class="time-btn" data-val="오후(12~18시)" onclick="selectTime(this,'${formId}_time')"
                style="padding:7px 14px;border:1.5px solid #ddd;border-radius:20px;background:white;font-size:13px;cursor:pointer;font-family:inherit">오후 (12~18시)</button>
              <button class="time-btn" data-val="저녁(18시이후)" onclick="selectTime(this,'${formId}_time')"
                style="padding:7px 14px;border:1.5px solid #ddd;border-radius:20px;background:white;font-size:13px;cursor:pointer;font-family:inherit">저녁 (18시 이후)</button>
              <button class="time-btn" data-val="아무때나" onclick="selectTime(this,'${formId}_time')"
                style="padding:7px 14px;border:1.5px solid #ddd;border-radius:20px;background:white;font-size:13px;cursor:pointer;font-family:inherit">아무때나</button>
            </div>
          </div>
          <button onclick="submitContact('${formId}')"
            style="width:100%;padding:13px;background:#1a2e4a;color:white;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit">
            사전점검상담 접수 완료
          </button>
          <div style="font-size:11px;color:#aaa;text-align:center;margin-top:8px">
            입력하신 정보는 상담 연락 목적으로만 사용됩니다.
          </div>
        </div>`;
      chatBody.appendChild(wrap);
      scrollDown();
    }, 600);
  }

  function selectTime(btn, groupId) {
    document.querySelectorAll(`#${groupId} .time-btn`).forEach(b => {
      b.style.background = 'white';
      b.style.borderColor = '#ddd';
      b.style.color = '#333';
      b.style.fontWeight = 'normal';
    });
    btn.style.background = '#1a2e4a';
    btn.style.color = 'white';
    btn.style.borderColor = '#1a2e4a';
    btn.style.fontWeight = '700';
    btn.dataset.selected = 'true';
  }

  function submitContact(formId) {
    const name  = document.getElementById(`${formId}_name`).value.trim();
    const phone = document.getElementById(`${formId}_phone`).value.trim();
    const timeBtn = document.querySelector(`#${formId}_time .time-btn[data-selected="true"]`);
    const time  = timeBtn ? timeBtn.dataset.val : '';

    if (!name)  { alert('이름을 입력해 주세요.'); return; }
    if (!phone) { alert('연락처를 입력해 주세요.'); return; }
    if (!time)  { alert('연락 가능 시간을 선택해 주세요.'); return; }

    // Google Sheets 전송
    fetch('https://script.google.com/macros/s/AKfycbws_TaV7h4bjP15yitRwsTzVdVVoOnPnhelrdO9wmE4xAsOawvEN-72g3m7j0mQbx6m/exec', {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        name:              name,
        contact:           phone,
        contactTime:       time,
        side:              answers.side              || '',
        caseType:          answers.caseType          || '',
        subType:           answers.subType           || '',
        companySize:       answers.companySize       || '',
        empType:           answers.empType           || '',
        tenure:            answers.tenure            || '',
        dismissalMethod:   answers.dismissalMethod   || '',
        dismissalNotice:   answers.dismissalNotice   || '',
        procedure:         answers.procedure         || '',
        timing:            answers.timing            || '',
        evidence:          answers.evidence          || '',
        wageType:          answers.wageType          || '',
        wageAmount:        answers.wageAmount        || '',
        insurance:         answers.insurance         || '',
        contract:          answers.contract          || '',
        perpetrator:       answers.perpetrator       || '',
        harassType:        answers.harassType        || '',
        harassDuration:    answers.harassDuration    || '',
        internalReport:    answers.internalReport    || '',
        workStatus:        answers.workStatus        || '',
        witness:           answers.witness           || '',
        bizIssue:          answers.bizIssue          || '',
        bizLabel:          answers.bizLabel          || '',
        contractStatus:    answers.contractStatus    || '',
        dismissalReason:   answers.dismissalReason   || '',
        disciplineProcess: answers.disciplineProcess || '',
        ruleStatus:        answers.ruleStatus        || '',
        disputeItem:       answers.disputeItem       || '',
        disputeTenure:     answers.disputeTenure     || '',
        disputeContract:   answers.disputeContract   || '',
        disputeStage:      answers.disputeStage      || '',
        inclusivePay:      answers.inclusivePay      || '',
        disputeHistory:    answers.disputeHistory    || '',
        specialEmp:        answers.specialEmp        || '',
        laborInspection:   answers.laborInspection   || '',
        negotiation:       answers.negotiation       || '',
        desiredOutcome:    answers.desiredOutcome    || '',
      })
    }).catch(() => {});

    // 폼 제거 후 사용자 메시지
    const formWrap = document.getElementById(`${formId}_name`).closest('div[style*="paddingLeft"]') ||
                     document.getElementById(`${formId}_name`).closest('div');
    // 상위 wrap 제거
    let el = document.getElementById(`${formId}_name`);
    while (el && !el.style.paddingLeft) el = el.parentElement;
    if (el) el.remove();

    addUserMessage(`${name} / ${phone} / ${time}`);

    // 완료 메시지
    const serviceLabels = {
      '1회상담': '1회 상담',
      '전체의뢰': '사건 전체 대응 의뢰',
      '정기자문': '정기 자문 계약 검토',
      '미정': '상담 후 결정',
    };
    const serviceNote = answers.serviceType
      ? `<br>• 희망 서비스: <strong>${serviceLabels[answers.serviceType] || answers.serviceType}</strong>` : '';

    setTimeout(async () => {
      await addBotMessage(
        `<strong>${name}</strong>님, 사전점검상담 접수가 완료되었습니다! ✅<br><br>` +
        `접수된 내용${serviceNote}<br>` +
        `노무사님이 검토 후 <strong>${time}</strong>에 연락드리겠습니다.<br><br>` +
        `급하신 경우 아래 번호로 직접 연락해 주세요.`, true, 0);
      setTimeout(() => {
        const wrap = document.createElement('div');
        wrap.style.paddingLeft = '44px';
        wrap.innerHTML = `
          <div style="background:#e8edf4;border-radius:12px;padding:14px 16px;border:1.5px solid #1a2e4a;font-size:14px">
            <div style="font-weight:700;margin-bottom:6px">📞 노무법인 하이랩 김포지사</div>
            <div style="font-size:18px;font-weight:700;color:#1a2e4a;margin:4px 0">${PHONE}</div>
            <div style="font-size:12px;color:#888">평일 09:00 ~ 18:00</div>
          </div>`;
        chatBody.appendChild(wrap);
        scrollDown();
      }, 600);
    }, 300);
  }

  // ==================== 시작 ====================
  setTimeout(() => step0_intro(), 400);
</script>
</body>
</html>
